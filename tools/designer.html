<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmetic Designer</title>
<link rel="stylesheet" href="../game.css">
<link rel="stylesheet" href="../src/ui/icons.css">
<style>
  html, body { overflow:auto !important; height:auto !important; touch-action:auto; user-select:none; -webkit-user-select:none; }
  body { background:#0d1017; color:#eef2f8; font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif; margin:0; }
  .app { display:grid; grid-template-columns:230px minmax(360px,1fr) 340px; gap:12px; padding:12px; min-height:100vh; align-items:start; }
  @media (max-width:1100px){ .app { grid-template-columns:1fr; } }
  .panel { background:#141925; border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:12px; }
  h1 { font-size:17px; margin:0 0 4px; letter-spacing:.04em; } h2 { font-size:11px; letter-spacing:.14em; color:#8b95a7; margin:14px 0 6px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .tab, .b { border:1px solid rgba(255,255,255,.14); background:#1b2231; color:#eef2f8; border-radius:9px; padding:7px 11px; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }
  .tab.on, .b.on { background:#35e0c8; color:#06231e; border-color:#35e0c8; }
  .b.pri { background:#35e0c8; color:#06231e; border-color:#35e0c8; } .b.warn { color:#ff7a8f; } .b.sm { padding:4px 8px; font-size:12px; }
  .b:disabled { opacity:.35; cursor:default; }
  .list { display:flex; flex-direction:column; gap:6px; max-height:34vh; overflow:auto; }
  .item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:10px; border:1px solid rgba(255,255,255,.08); background:#10151f; cursor:pointer; font-size:13px; }
  .item.on { border-color:#35e0c8; } .item small { color:#8b95a7; margin-left:auto; }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .toolbar .sep { width:1px; height:26px; background:rgba(255,255,255,.12); margin:0 4px; }
  .toolbar .ctl { display:flex; align-items:center; gap:6px; font-size:12px; color:#8b95a7; white-space:nowrap; flex-wrap:wrap; }
  .toolbar input[type=color] { width:34px; height:30px; padding:1px; }
  .stage { position:relative; border-radius:14px; background:#0b0e15; line-height:0; }
  canvas#pv { width:100%; height:auto; aspect-ratio:1/1; touch-action:none; cursor:default; border-radius:14px; display:block; }
  label { display:block; font-size:12px; color:#8b95a7; margin:8px 0 3px; }
  input:not([type=checkbox]), select { width:100%; background:#0d1017; color:#eef2f8; border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:7px; font:inherit; font-size:13px; user-select:text; -webkit-user-select:text; box-sizing:border-box; }
  input[type=color] { padding:2px; height:32px; } input[type=range] { padding:0; }
  .row { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; } .row3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .layer { display:flex; align-items:center; gap:6px; padding:6px 8px; border:1px solid rgba(255,255,255,.1); border-radius:10px; margin-top:5px; background:#10151f; cursor:pointer; font-size:13px; }
  .layer.on { border-color:#35e0c8; background:#13221f; } .layer.hid { opacity:.45; }
  .layer .sw { width:16px; height:16px; border-radius:5px; border:1px solid rgba(255,255,255,.3); flex:none; } .layer span { flex:1; }
  .status { font-size:12px; color:#8b95a7; margin-top:8px; line-height:1.5; white-space:pre-wrap; user-select:text; }
  .status b { color:#35e0c8; } .ok { color:#7ee787; } .bad { color:#ff7a8f; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  details { margin-top:10px; } summary { cursor:pointer; color:#8b95a7; font-size:12px; letter-spacing:.1em; }
  #game { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; border:0; }
  .help { font-size:12px; color:#8b95a7; line-height:1.5; }
  .pal { display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin-top:6px; }
  .pal i { aspect-ratio:1; border-radius:6px; border:1px solid rgba(255,255,255,.25); cursor:pointer; }
  .stamps { display:flex; flex-wrap:wrap; gap:6px; }
  .chk { display:flex; align-items:center; gap:6px; font-size:13px; color:#eef2f8; margin:8px 0 0; }
  .chk input { width:auto; }
  .trail-wrap { margin-top:8px; display:block; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; place-items:center; z-index:50; } .modal.on { display:grid; }
  .modal .box { width:min(560px,92vw); background:#141925; border-radius:14px; padding:14px; border:1px solid rgba(255,255,255,.14); }
  .modal textarea { width:100%; height:260px; background:#0d1017; color:#eef2f8; border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:8px; font:12px ui-monospace,monospace; box-sizing:border-box; user-select:text; -webkit-user-select:text; }
</style>
</head>
<body>
<iframe id="game" src="../index.html" title="game"></iframe>
<div class="app">
  <!-- LEFT -->
  <div class="panel">
    <h1>Cosmetic Designer</h1>
    <div class="help">Real game drawing code: what you see is what ships.</div>
    <div class="tabs" id="tabs"></div>
    <div class="actions" style="margin:0 0 8px"><button class="b pri" id="new">+ New</button><button class="b" id="dup">Duplicate</button></div>
    <h2>YOUR DESIGNS</h2><div class="list" id="mine"></div>
    <h2>BUILT-IN (copy to remix)</h2><div class="list" id="builtin"></div>
  </div>

  <!-- MIDDLE -->
  <div class="panel">
    <div class="toolbar" id="tools"></div>
    <div class="stage"><canvas id="pv" width="900" height="900"></canvas></div>
    <div class="toolbar" style="margin-top:8px">
      <div class="ctl">Zoom <input type="range" id="zoom" min="18" max="50" value="30" style="width:110px"></div>
      <div class="ctl" id="tryon"></div>
    </div>
    <div class="trail-wrap" id="trailwrap"></div>
    <div class="help" id="hint" style="margin-top:6px"></div>
    <h2 id="stamph">STAMPS (click to add)</h2><div class="stamps" id="stamps"></div>
  </div>

  <!-- RIGHT -->
  <div class="panel">
    <div id="editor"></div>
    <h2>SAVE &amp; PUBLISH</h2>
    <div class="actions">
      <button class="b pri" id="save">Save to project</button>
      <button class="b" id="push">Push to GitHub</button>
      <button class="b" id="download">Download</button>
    </div>
    <div class="actions">
      <button class="b sm" id="copyj">Copy design JSON</button><button class="b sm" id="pastej">Paste design JSON</button>
    </div>
    <div class="status" id="status"></div>
    <details><summary>GITHUB SETTINGS (for Push)</summary>
      <label>Repository (owner/name)</label><input id="gh-repo" value="FJB908/rage-race">
      <label>Branch</label><input id="gh-branch" value="claude/affectionate-brown-5d6ma7">
      <label>Personal access token (repo scope). Stays only in this browser.</label><input id="gh-token" type="password" placeholder="ghp_...">
    </details>
  </div>
</div>
<div class="modal" id="modal"><div class="box"><div id="modal-t" class="help" style="margin-bottom:6px"></div><textarea id="modal-ta"></textarea><div class="actions"><button class="b pri" id="modal-ok">OK</button><button class="b" id="modal-x">Close</button></div></div></div>

<script>
(() => {
'use strict';
const KINDS = { skin:'skins', hat:'hats', face:'faces', trail:'trails' };
const GAME_ARR = { skin:'SKINS', hat:'HATS', face:'FACES', trail:'TRAILS' };
const RARITIES = ['common','rare','epic','legendary'];
const FILE_PATH = 'src/data/custom-cosmetics.js';
const PATTERNS = { solid:['a'], grad:['a','b'], stripes:['a','b'], dots:['a','b'], checker:['a','b'], tiger:['a','b'], camo:['a','b','c'] };
const TRAIL_STYLES = ['soft','spark','star','prism','nebula','frost','blueprint','ember','comet','ribbon','glitch'];
const PRICE = { common:250, rare:700, epic:1500, legendary:3000 };
const SWATCHES = ['#ffffff','#e8ecf2','#9aa3b5','#3a4152','#1a1208','#ff5470','#ff7a3d','#ffcf3f','#9be15d','#35e0c8','#5b8def','#7c6bff','#ff71d2','#8a4b2a','#f5d7b0','#c9d1e3','#ffe27a','#b3a9ff','#127b6c','#a8203a'];
const $ = s => document.querySelector(s);
const el = (t, p, h) => { const e = document.createElement(t); if (p) Object.assign(e, p); if (h !== undefined) e.innerHTML = h; return e; };
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => (s || 'item').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
const r1 = v => Math.round(v * 100) / 100;

let W = null;
let db = { skins:[], hats:[], faces:[], trails:[] };
let kind = 'skin', sel = -1, ls = -1, tool = 'select', sym = true, snap = true, showGrid = true;
let curFill = '#ffcf3f', curStroke = '#1a1208', curSw = 1.2;
let dirHandle = null, dirty = false;
let tryOn = { skin:'classic', hat:'none', face:'none' };
let ZOOM = .30, CY = .62;
const gameArr = k => W.eval(GAME_ARR[k]);
const cur = () => db[KINDS[kind]][sel] || null;
const hasLayers = () => kind !== 'trail';
const curLayer = () => { const it = cur(); return it && it.layers ? it.layers[ls] || null : null; };

// ============ history ============
let hist = [], hpos = -1, commitT = 0;
const snapshot = () => JSON.stringify({ db, sel, ls, kind });
function commitNow() { clearTimeout(commitT); const s = snapshot(); if (hist[hpos] === s) return; hist = hist.slice(0, hpos + 1); hist.push(s); if (hist.length > 100) hist.shift(); hpos = hist.length - 1; try { localStorage.setItem('designer_draft', JSON.stringify(db)); localStorage.setItem('designer_dirty', dirty ? '1' : '0'); } catch (e) {} }
function commitSoon() { clearTimeout(commitT); commitT = setTimeout(commitNow, 450); }
function restore(s) { const o = JSON.parse(s); db = o.db; kind = o.kind; sel = o.sel; ls = o.ls; markDirty(true); renderAll(); }
function undo() { commitNow(); if (hpos > 0) { hpos--; restore(hist[hpos]); } }
function redo() { if (hpos < hist.length - 1) { hpos++; restore(hist[hpos]); } }

// ============ game sync ============
function syncGame() {
  for (const k of Object.keys(KINDS)) {
    const arr = gameArr(k);
    for (let i = arr.length - 1; i >= 0; i--) if (arr[i].custom) arr.splice(i, 1);
    for (const it of db[KINDS[k]]) arr.push(Object.assign({ custom:true }, clone(it)));
  }
  try { const tb = W.eval('TRAIL_BY_ID'); for (const t of gameArr('trail')) tb[t.id] = t; } catch (e) {}
}

// ============ geometry ============
const pv = $('#pv'), g2 = pv.getContext('2d'), off = document.createElement('canvas'); off.width = pv.width; off.height = pv.height;
const K = () => pv.width * ZOOM / 12, CX = () => pv.width / 2, CYP = () => pv.height * CY;
const u2p = (x, y) => [CX() + x * K(), CYP() + y * K()];
const sn = v => snap ? Math.round(v * 2) / 2 : r1(v);
const rad = d => (d || 0) * Math.PI / 180;
function toLocal(L, ux, uy) { const a = -rad(L.rot), dx = ux - L.x, dy = uy - L.y; return [dx * Math.cos(a) - dy * Math.sin(a), dx * Math.sin(a) + dy * Math.cos(a)]; }
function fromLocal(L, lx, ly) { const a = rad(L.rot); return [L.x + lx * Math.cos(a) - ly * Math.sin(a), L.y + lx * Math.sin(a) + ly * Math.cos(a)]; }
const centroid = L => { let x = 0, y = 0; L.pts.forEach(p => { x += p[0]; y += p[1]; }); return [x / L.pts.length, y / L.pts.length]; };
function segDist(px, py, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy || 1e-9; let t = ((px - a[0]) * dx + (py - a[1]) * dy) / l; t = Math.max(0, Math.min(1, t)); return Math.hypot(px - (a[0] + t * dx), py - (a[1] + t * dy)); }
function inPoly(px, py, pts) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { if (((pts[i][1] > py) !== (pts[j][1] > py)) && (px < (pts[j][0] - pts[i][0]) * (py - pts[i][1]) / (pts[j][1] - pts[i][1]) + pts[i][0])) c = !c; } return c; }
function hit(L, ux, uy) {
  if (L.hidden) return false;
  const tol = 6 / K();
  if (L.t === 'rect') { const [lx, ly] = toLocal(L, ux, uy); return Math.abs(lx) <= L.w / 2 + tol && Math.abs(ly) <= L.h / 2 + tol; }
  if (L.t === 'ellipse') { const [lx, ly] = toLocal(L, ux, uy); return (lx / (L.rx + tol)) ** 2 + (ly / (L.ry + tol)) ** 2 <= 1; }
  if (L.open) { for (let i = 0; i < L.pts.length - 1; i++) if (segDist(ux, uy, L.pts[i], L.pts[i + 1]) < Math.max(tol, (L.sw || 1) / 2 + tol)) return true; return false; }
  if (inPoly(ux, uy, L.pts)) return true;
  for (let i = 0; i < L.pts.length; i++) if (segDist(ux, uy, L.pts[i], L.pts[(i + 1) % L.pts.length]) < tol) return true;
  return false;
}
function handlesOf(L) {
  const H = [], up = 30 / K();
  if (L.t === 'rect' || L.t === 'ellipse') {
    const hw = L.t === 'rect' ? L.w / 2 : L.rx, hh = L.t === 'rect' ? L.h / 2 : L.ry;
    [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].forEach((c, i) => { const p = fromLocal(L, c[0], c[1]); H.push({ id:'c' + i, x:p[0], y:p[1] }); });
    const r = fromLocal(L, 0, -hh - up); H.push({ id:'rot', x:r[0], y:r[1] });
  } else {
    L.pts.forEach((p, i) => H.push({ id:'v' + i, x:p[0], y:p[1] }));
    const n = L.pts.length, lim = L.open ? n - 1 : n;
    for (let i = 0; i < lim; i++) { const a = L.pts[i], b = L.pts[(i + 1) % n]; H.push({ id:'m' + i, x:(a[0] + b[0]) / 2, y:(a[1] + b[1]) / 2, mid:true }); }
    const c = centroid(L), minY = Math.min(...L.pts.map(p => p[1])); H.push({ id:'rot', x:c[0], y:minY - up });
  }
  return H;
}

// ============ render ============
let draft = null;   // in-progress drawing
function render() {
  if (!W) return;
  syncGame();
  const it = cur();
  const look = { skin:tryOn.skin, hat:tryOn.hat, face:tryOn.face, trail:'none' };
  if (it) look[kind] = it.id;
  try { W.renderLook(off, look, { scale:ZOOM, cy:CY }); } catch (e) { console.error(e); }
  const g = g2; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, pv.width, pv.height);
  g.fillStyle = '#10151f'; g.fillRect(0, 0, pv.width, pv.height);
  if (showGrid) {
    const k = K(); g.lineWidth = 1;
    for (let u = -30; u <= 30; u++) { g.strokeStyle = u % 4 === 0 ? 'rgba(255,255,255,.09)' : 'rgba(255,255,255,.035)';
      const x = CX() + u * k, y = CYP() + u * k; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, pv.height); g.stroke(); g.beginPath(); g.moveTo(0, y); g.lineTo(pv.width, y); g.stroke(); }
    g.strokeStyle = 'rgba(53,224,200,.45)'; g.setLineDash([6, 6]); g.beginPath(); g.moveTo(CX(), 0); g.lineTo(CX(), pv.height); g.stroke(); g.setLineDash([]);
  }
  g.drawImage(off, 0, 0);
  const L = hasLayers() && it && it.layers ? it.layers[ls] : null;
  if (L && !L.hidden) drawHandles(g, L);
  if (draft) drawDraft(g);
  const tw = $('#trailwrap'), isTrail = kind === 'trail' && it;
  document.querySelector('.stage').style.display = kind === 'trail' ? 'none' : ''; if (kind === 'trail') $('#hint').textContent = 'Edit the effect layers on the right. The preview loops live.';
  if (isTrail) { if (!tw.firstChild) tw.innerHTML = '<canvas id="trailpv" width="900" height="460" style="width:100%;border-radius:14px;background:#10151f;display:block"></canvas>'; startTrailAnim(); } else { tw.innerHTML = ''; stopTrailAnim(); }
  $('#stamps').style.display = $('#stamph').style.display = hasLayers() ? '' : 'none';
  $('#tools').style.display = hasLayers() ? '' : 'none';
}
function drawHandles(g, L) {
  g.save(); g.strokeStyle = '#35e0c8'; g.fillStyle = '#0d1017'; g.lineWidth = 1.6; g.setLineDash([6, 4]);
  if (L.t === 'rect' || L.t === 'ellipse') {
    const hw = L.t === 'rect' ? L.w / 2 : L.rx, hh = L.t === 'rect' ? L.h / 2 : L.ry;
    g.beginPath(); [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].forEach((c, i) => { const p = u2p(...fromLocal(L, c[0], c[1])); i ? g.lineTo(...p) : g.moveTo(...p); }); g.closePath(); g.stroke();
  } else {
    g.beginPath(); L.pts.forEach((p, i) => { const q = u2p(p[0], p[1]); i ? g.lineTo(...q) : g.moveTo(...q); }); if (!L.open) g.closePath(); g.stroke();
  }
  g.setLineDash([]);
  for (const h of handlesOf(L)) {
    const [x, y] = u2p(h.x, h.y); g.beginPath();
    if (h.id === 'rot') { g.fillStyle = '#35e0c8'; g.arc(x, y, 7, 0, 7); g.fill(); g.strokeStyle = '#0d1017'; g.stroke(); continue; }
    if (h.mid) { g.fillStyle = 'rgba(53,224,200,.25)'; g.arc(x, y, 4.5, 0, 7); g.fill(); g.strokeStyle = '#35e0c8'; g.stroke(); continue; }
    g.fillStyle = '#fff'; g.rect(x - 6, y - 6, 12, 12); g.fill(); g.strokeStyle = '#35e0c8'; g.stroke();
  }
  g.restore();
}
function drawDraft(g) {
  g.save(); g.strokeStyle = '#ffcf3f'; g.fillStyle = 'rgba(255,207,63,.15)'; g.lineWidth = 2; g.setLineDash([6, 4]);
  if (draft.type === 'box') {
    const a = u2p(draft.a[0], draft.a[1]), b = u2p(draft.b[0], draft.b[1]);
    g.beginPath(); if (draft.shape === 'rect') g.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]); else g.ellipse((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.abs(b[0] - a[0]) / 2, Math.abs(b[1] - a[1]) / 2, 0, 0, 7);
    g.fill(); g.stroke();
  } else {
    g.beginPath(); draft.pts.forEach((p, i) => { const q = u2p(p[0], p[1]); i ? g.lineTo(...q) : g.moveTo(...q); }); if (draft.hover) g.lineTo(...u2p(draft.hover[0], draft.hover[1])); g.stroke();
    draft.pts.forEach((p, i) => { const q = u2p(p[0], p[1]); g.beginPath(); g.arc(q[0], q[1], i === 0 ? 7 : 4, 0, 7); g.fillStyle = i === 0 ? '#ffcf3f' : '#fff'; g.fill(); });
    if (draft.mirror) { g.globalAlpha = .4; g.beginPath(); draft.pts.forEach((p, i) => { const q = u2p(-p[0], p[1]); i ? g.lineTo(...q) : g.moveTo(...q); }); g.stroke(); }
  }
  g.restore();
}

let trailRaf = 0, trailT0 = 0;
function startTrailAnim() { if (trailRaf) return; trailT0 = performance.now(); const loop = now => { const cv = document.getElementById('trailpv'), it = cur(); if (!cv || kind !== 'trail' || !it) { trailRaf = 0; return; }
  try { W.drawTrailPreview(cv, it, 1.15 + ((now - trailT0) / 1000) % 6.2); } catch (e) {} trailRaf = requestAnimationFrame(loop); }; trailRaf = requestAnimationFrame(loop); }
function stopTrailAnim() { cancelAnimationFrame(trailRaf); trailRaf = 0; }

// ============ layers: create / edit ============
function newLayer(t, geom) { return Object.assign({ t, fill:curFill, stroke:curStroke, sw:curSw }, geom); }
function mirrorOf(L) { const c = clone(L); if (c.t === 'poly') c.pts = c.pts.map(([x, y]) => [-x, y]); else { c.x = -c.x; c.rot = -(c.rot || 0); } return c; }
function addLayers(list) {
  const it = cur(); if (!it) return;
  if (!it.layers) it.layers = [];
  list.forEach(L => it.layers.push(L)); ls = it.layers.length - 1;
  setTool('select'); changed(true);
}
function addWithSym(L) { const list = [L]; if (sym) { const cx = L.t === 'poly' ? centroid(L)[0] : L.x; if (Math.abs(cx) > .4) list.push(mirrorOf(L)); } addLayers(list); }
function finishPoly() {
  if (!draft || draft.type !== 'poly') return;
  const pts = draft.pts; draft = null;
  if (pts.length < 3) { render(); return; }
  addWithSym(newLayer('poly', { pts }));
}
function simplify(pts, eps) {
  if (pts.length < 3) return pts;
  let dmax = 0, idx = 0; const a = pts[0], b = pts[pts.length - 1];
  for (let i = 1; i < pts.length - 1; i++) { const d = segDist(pts[i][0], pts[i][1], a, b); if (d > dmax) { dmax = d; idx = i; } }
  if (dmax > eps) { const l = simplify(pts.slice(0, idx + 1), eps), r = simplify(pts.slice(idx), eps); return l.slice(0, -1).concat(r); }
  return [a, b];
}
const HINTS = { select:'Click a shape to select it. Drag to move, drag the white squares to resize or reshape, the green dot rotates. Click a small circle on an edge to add a corner. Double-click a corner to delete it. Arrow keys nudge, Delete removes, Ctrl+Z undoes.',
  rect:'Drag to draw a rectangle.', ellipse:'Drag to draw an ellipse.', poly:'Click to place corners. Click the yellow first point, double-click, or press Enter to close. Esc cancels.', pen:'Hold and draw freely. Close the loop for a filled shape, or leave it open for a line. It is smoothed automatically.' };
function setTool(t) { tool = t; draft = null; act = null; buildTools(); render(); pv.style.cursor = t === 'select' ? 'default' : 'crosshair'; $('#hint').textContent = HINTS[t] || ''; }

// ============ pointer interaction ============
let act = null;

    else if (L.t === 'ellipse') ['x', 'y', 'rx', 'ry', 'rot'].forEach(k => nr.appendChild(F(k, bind(L, k, 'number', { step:.5 }))));
    det.appendChild(nr);
    if (L.t === 'poly') { const pi = el('input', { type:'text' }); pi.value = L.pts.map(p => p.join(',')).join(' '); pi.oninput = () => { const pts = pi.value.trim().split(/\s+/).map(s => s.split(',').map(Number)).filter(p => p.length === 2 && p.every(isFinite)); if (pts.length > 2) { L.pts = pts; changed(); } }; det.appendChild(F('Points "x,y x,y ..."', pi)); }

  }
  box.appendChild(el('div', { className:'actions' })).appendChild(el('button', { className:'b warn', onclick:() => { if (confirm('Delete this whole design?')) del(); } }, 'Delete design'));
}
const SHAPES = ['circle', 'square', 'diamond', 'star', 'star4', 'heart', 'bolt', 'ring', 'snow', 'leaf', 'note', 'drop', 'flame', 'cross', 'tri', 'bubble', 'coin'];
let tl = 0;
function buildTrailEditor(box, it) {
  if (!Array.isArray(it.fx)) { it.fx = it.fx ? [it.fx] : [{ life:.7, rate:.03, max:26, shape:'circle', colors:[it.color || '#ffffff'], size:[5, 1], spread:3 }]; it.style = 'fx'; }
  if (tl >= it.fx.length) tl = it.fx.length - 1;
  const bar = el('div', { className:'actions', style:'margin:0' });
  bar.appendChild(el('button', { className:'b sm', onclick:() => { it.fx.push({ life:.8, rate:.03, max:28, shape:'star4', colors:['#ffffff', '#cfe9ff'], size:[4, .6], spread:6, twinkle:true, glow:.8 }); tl = it.fx.length - 1; changed(true); } }, '+ Particles'));
  bar.appendChild(el('button', { className:'b sm', onclick:() => { it.fx.push({ life:.8, rate:.03, max:28, ribbon:{ w:7, colors:['#ffffff', '#ff71d2'], alpha:.5 } }); tl = it.fx.length - 1; changed(true); } }, '+ Ribbon'));
  bar.appendChild(el('button', { className:'b sm', onclick:() => { it.fx.splice(tl + 1, 0, clone(it.fx[tl])); tl++; changed(true); } }, 'Copy'));
  bar.appendChild(el('button', { className:'b sm warn', onclick:() => { if (it.fx.length > 1) { it.fx.splice(tl, 1); tl = 0; changed(true); } } }, 'Delete layer'));
  box.appendChild(el('h2', {}, 'EFFECT LAYERS')); box.appendChild(bar);
  it.fx.forEach((L, i) => { const row = el('div', { className:'layer' + (i === tl ? ' on' : ''), onclick:() => { tl = i; buildEditor(); } });
    const sw = el('div', { className:'sw' }); sw.style.background = (L.colors || (L.ribbon && L.ribbon.colors) || ['#fff'])[0]; row.appendChild(sw); row.appendChild(el('span', {}, (L.ribbon && !L.shape ? 'ribbon' : L.shape || 'layer') + ' ' + (i + 1))); box.appendChild(row); });
  const L = it.fx[tl]; if (!L) return;
  const num = (obj, key, label, step, min) => F(label, bind(obj, key, 'number', { step:step || .1, min:min === undefined ? 0 : min }));
  const colors = (obj, key, label) => { const i = el('input', { type:'text' }); i.value = (obj[key] || []).join(', '); i.oninput = () => { const c = i.value.split(/[ ,]+/).filter(x => /^#[0-9a-fA-F]{3,6}$/.test(x)); if (c.length) { obj[key] = c; changed(); } }; return F(label + ' (hex, comma separated)', i); };
  box.appendChild(el('h2', {}, 'SELECTED LAYER'));
  const timing = el('div', { className:'row3' }); timing.appendChild(num(L, 'life', 'Life (s)', .05, .1)); timing.appendChild(num(L, 'rate', 'Emit every (s)', .005, .01)); timing.appendChild(num(L, 'max', 'Max count', 1, 4)); box.appendChild(timing);
  if (L.shape !== undefined || !L.ribbon) {
    const ss = el('select'); SHAPES.forEach(x => ss.appendChild(el('option', { value:x, selected:x === L.shape }, x))); ss.onchange = () => { L.shape = ss.value; changed(true); }; box.appendChild(F('Shape', ss));
    const ms = el('select'); ['age', 'seed', 'rainbow'].forEach(x => ms.appendChild(el('option', { value:x, selected:x === (L.colorMode || 'age') }, x === 'age' ? 'colors fade over life' : x === 'seed' ? 'random pick per particle' : 'rainbow'))); ms.onchange = () => { L.colorMode = ms.value; changed(true); }; box.appendChild(F('Color mode', ms));
    box.appendChild(colors(L, 'colors', 'Colors'));
    if (!L.size) L.size = [5, 1]; if (!L.drift) L.drift = [0, 0];
    const r1_ = el('div', { className:'row3' }); r1_.appendChild(F('Size start', bind(L.size, 0, 'number', { step:.2, min:.2 }))); r1_.appendChild(F('Size end', bind(L.size, 1, 'number', { step:.2, min:0 }))); r1_.appendChild(num(L, 'spread', 'Spread', .5)); box.appendChild(r1_);
    const r2_ = el('div', { className:'row3' }); r2_.appendChild(F('Drift X', bind(L.drift, 0, 'number', { step:2 }))); r2_.appendChild(F('Drift Y', bind(L.drift, 1, 'number', { step:2 }))); r2_.appendChild(num(L, 'vx', 'Random sideways', 2)); box.appendChild(r2_);
    const r3_ = el('div', { className:'row3' }); r3_.appendChild(num(L, 'gravity', 'Gravity', 5, -400)); r3_.appendChild(num(L, 'spin', 'Spin', .5, -20)); r3_.appendChild(num(L, 'glow', 'Glow', .1)); box.appendChild(r3_);
    box.appendChild(F('Opacity', bind(Object.assign(L, { alpha:L.alpha === undefined ? .9 : L.alpha }), 'alpha', 'range', { min:0, max:1, step:.05 })));
    const ck = (key, label) => { const l = el('label', { className:'chk' }); l.appendChild(el('input', { type:'checkbox', checked:!!L[key], onchange:e => { L[key] = e.target.checked; changed(true); } })); l.appendChild(document.createTextNode(label)); box.appendChild(l); };
    ck('twinkle', 'Twinkle'); ck('randRot', 'Random rotation');
  }
  const hasR = !!L.ribbon, rl = el('label', { className:'chk' }); rl.appendChild(el('input', { type:'checkbox', checked:hasR, onchange:e => { if (e.target.checked) L.ribbon = { w:6, colors:L.colors ? L.colors.slice(0, 3) : ['#ffffff'], alpha:.5 }; else delete L.ribbon; changed(true); } })); rl.appendChild(document.createTextNode('Ribbon (continuous band)')); box.appendChild(rl);
  if (L.ribbon) { const R_ = el('div', { className:'row3' }); R_.appendChild(num(L.ribbon, 'w', 'Width', .5, .5)); R_.appendChild(num(L.ribbon, 'alpha', 'Opacity', .05)); R_.appendChild(num(L.ribbon, 'dy', 'Offset', .5, -20)); box.appendChild(R_); box.appendChild(colors(L.ribbon, 'colors', 'Ribbon colors')); }
  box.appendChild(el('div', { className:'actions' })).appendChild(el('button', { className:'b warn', onclick:() => { if (confirm('Delete this whole design?')) del(); } }, 'Delete design'));
}
function del() { db[KINDS[kind]].splice(sel, 1); sel = Math.min(sel, db[KINDS[kind]].length - 1); ls = -1; changed(true); renderAll(); }

// ============ save / publish ============
function cleanItem(it) { const c = clone(it); delete c.custom; if (c.layers) { c.layers.forEach(L => { delete L.cx; delete L.cy; if (L.alpha === 1) delete L.alpha; }); if (!c.layers.length) delete c.layers; } return c; }
function fileText() { const out = {}; for (const k of Object.keys(db)) out[k] = db[k].map(cleanItem);
  return '// Cosmetics made with tools/designer.html. Edit them in the tool; this file is rewritten when you press Save.\nconst CUSTOM_COSMETICS = ' + JSON.stringify(out, null, 2) + ';\n'; }
function setStatus(html) { $('#status').innerHTML = html; }
function markDirty(silent) { dirty = true; if (!silent) setStatus('<b>Unsaved changes.</b> Press "Save to project" to put them in the game.'); }
const idb = { open: () => new Promise((res, rej) => { const r = indexedDB.open('designer', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = rej; }),
  async get(k) { const d = await this.open(); return new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async set(k, v) { const d = await this.open(); return new Promise(res => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; }); } };
async function ensureDir(ask) {
  if (!window.showDirectoryPicker) throw new Error('This browser cannot write files directly. Use Chrome or Edge, or Download.');
  if (!dirHandle) dirHandle = await idb.get('dir');
  if (dirHandle) { let p = await dirHandle.queryPermission({ mode:'readwrite' }); if (p !== 'granted' && ask) p = await dirHandle.requestPermission({ mode:'readwrite' }); if (p === 'granted') return dirHandle; }
  if (!ask) return null;
  dirHandle = await showDirectoryPicker({ mode:'readwrite', id:'rage-race-project' }); await idb.set('dir', dirHandle); return dirHandle;
}
async function fileHandle(root, create) { const parts = FILE_PATH.split('/'); let d = root; for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p); return d.getFileHandle(parts[parts.length - 1], { create }); }
$('#save').onclick = async () => {
  try {
    commitNow(); const root = await ensureDir(true);
    try { await root.getDirectoryHandle('src'); } catch (e) { throw new Error('Pick the project root folder (the one that contains index.html and src/).'); }
    const fh = await fileHandle(root, true), w = await fh.createWritable(); await w.write(fileText()); await w.close();
    dirty = false; localStorage.setItem('designer_dirty', '0'); setStatus('<span class="ok">Saved to ' + FILE_PATH + '.</span> Reload the game to see it. Next: Push to GitHub, or commit in VS Code.');
  } catch (e) { setStatus('<span class="bad">' + e.message + '</span>'); }
};
$('#download').onclick = () => { el('a', { href:URL.createObjectURL(new Blob([fileText()], { type:'text/javascript' })), download:'custom-cosmetics.js' }).click(); setStatus('Downloaded. Put it at <b>' + FILE_PATH + '</b> in the project.'); };
const ghKey = k => 'designer_' + k;
['repo', 'branch', 'token'].forEach(k => { const i = $('#gh-' + k); const v = localStorage.getItem(ghKey(k)); if (v) i.value = v; i.oninput = () => localStorage.setItem(ghKey(k), i.value.trim()); });
$('#push').onclick = async () => {
  const repo = $('#gh-repo').value.trim(), branch = $('#gh-branch').value.trim(), token = $('#gh-token').value.trim();
  if (!token) { document.querySelector('details:last-of-type').open = true; setStatus('<span class="bad">Add a GitHub token under GitHub settings first.</span>'); return; }
  try {
    commitNow(); setStatus('Pushing...');
    const url = `https://api.github.com/repos/${repo}/contents/${FILE_PATH}`, H = { Authorization:'Bearer ' + token, Accept:'application/vnd.github+json' };
    const g = await fetch(url + '?ref=' + encodeURIComponent(branch), { headers:H }); let sha; if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error('GitHub says ' + g.status + ' (check repo, branch and token).');
    const body = { message:'Update custom cosmetics from designer', branch, content:btoa(unescape(encodeURIComponent(fileText()))) }; if (sha) body.sha = sha;
    const p = await fetch(url, { method:'PUT', headers:Object.assign({ 'Content-Type':'application/json' }, H), body:JSON.stringify(body) });
    if (!p.ok) throw new Error('Push failed: ' + p.status + ' ' + ((await p.json()).message || ''));
    dirty = false; localStorage.setItem('designer_dirty', '0'); setStatus('<span class="ok">Pushed to ' + repo + ' (' + branch + ').</span> Pull in VS Code to get it locally.');
  } catch (e) { setStatus('<span class="bad">' + e.message + '</span>'); }
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// share one design as JSON
const modal = $('#modal');
function openModal(title, text, ok) { $('#modal-t').textContent = title; $('#modal-ta').value = text; modal.classList.add('on'); $('#modal-ok').onclick = () => { try { if (ok) ok($('#modal-ta').value); modal.classList.remove('on'); } catch (e) { $('#modal-t').textContent = 'Error: ' + e.message; } }; }
$('#modal-x').onclick = () => modal.classList.remove('on');
$('#copyj').onclick = () => { const it = cur(); if (!it) return; const t = JSON.stringify({ kind, item:cleanItem(it) }, null, 1); try { navigator.clipboard.writeText(t); } catch (e) {} openModal('Design JSON (copied to clipboard). Paste it to share.', t, null); };
$('#pastej').onclick = () => openModal('Paste a design JSON here, then press OK.', '', t => { const o = JSON.parse(t); if (!KINDS[o.kind] || !o.item) throw new Error('Not a design JSON.'); kind = o.kind; o.item.id = uniqueId(o.item.name || 'import'); addItem(o.item); });

// ============ boot ============
function renderAll() { buildTools(); buildTryOn(); renderLists(); buildEditor(); render(); }
async function loadExisting() {
  try { const root = await ensureDir(false); if (root) { const f = await (await fileHandle(root, false)).getFile(); const t = await f.text(); const j = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1)); for (const k of Object.keys(db)) db[k] = j[k] || []; setStatus('Loaded ' + FILE_PATH + ' from your project folder.'); return; } } catch (e) {}
  try { const c = W.eval('typeof CUSTOM_COSMETICS !== "undefined" ? JSON.stringify(CUSTOM_COSMETICS) : "{}"'); const j = JSON.parse(c); for (const k of Object.keys(db)) db[k] = (j[k] || []).map(it => { delete it.custom; return it; }); } catch (e) {}
  setStatus('Tip: press "Save to project" once and pick your project folder. After that, saving is one click.');
}
$('#zoom').oninput = e => { ZOOM = +e.target.value / 100; render(); };
$('#game').addEventListener('load', async () => {
  W = $('#game').contentWindow; await new Promise(r => setTimeout(r, 400));
  await loadExisting();
  try { if (localStorage.getItem('designer_dirty') === '1') { const d = JSON.parse(localStorage.getItem('designer_draft')); if (d && JSON.stringify(d) !== JSON.stringify(db)) { db = d; dirty = true; setStatus('<b>Restored your unsaved draft.</b> Press Save to put it in the game.'); } } } catch (e) {}
  buildStamps(); sel = db.skins.length ? 0 : -1; renderAll(); commitNow(); setTool('select');

})();
